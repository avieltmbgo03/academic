<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hirono Collection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f5f0e8;
      --terracotta: #c0584a;
      --terra-dark: #a84538;
      --dark-text: #2b2b2b;
      --muted: #6b6b6b;
      --border: #d9d0c0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--cream);
      color: var(--dark-text);
      overflow-x: hidden;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    header {
      background-color: var(--terracotta);
      color: var(--cream);
      padding: 70px 0 80px;
    }

    header .hello-text {
      font-size: 0.9rem;
      color: rgba(245, 240, 232, 0.8);
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      animation: slideUp 0.6s 0.2s ease both;
    }

    header h1 {
      font-family: 'Courier Prime', monospace;
      font-size: 3.2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 6px;
      animation: slideUp 0.7s 0.35s ease both;
    }

    header .role {
      font-size: 1rem;
      font-style: italic;
      color: rgba(245, 240, 232, 0.9);
      min-height: 1.5em;
      margin-bottom: 0;
      animation: slideUp 0.7s 0.5s ease both;
    }

    #cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: rgba(245, 240, 232, 0.85);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    .divider {
      width: 40px;
      height: 3px;
      border-radius: 2px;
      background-color: var(--cream);
      margin: 14px auto;
    }

    .bento {
      padding-top: 40px;
      padding-bottom: 40px;
    }

    .card {
      min-height: 200px;
      background-color: var(--border);
      border: none;
      border-radius: 10px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 0.6s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .card.revealed:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
    }

    .card img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.08);
    }

    footer {
      background-color: var(--terra-dark);
      color: rgba(245, 240, 232, 0.5);
      text-align: center;
      padding: 20px 0;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    footer .divider {
      background-color: rgba(245, 240, 232, 0.5);
      margin-top: 0;
    }

    #scrollTop {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--terracotta);
      color: #fff;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
    }

    #scrollTop.visible {
      opacity: 1;
      pointer-events: all;
    }

    #scrollTop:hover {
      transform: translateY(-3px);
    }
  </style>
</head>

<body>
  <header class="container-fluid p-3 text-center">
    
    <h1>Hirono Collection</h1>
    <div class="divider"></div>
    <p class="role"><span id="role-text"></span><span id="cursor"></span></p>
  </header>

  <div class="container-fluid p-3 bento">
    <div class="row">
      <div class="col-12 col-md-2 p-1">
        <div class="card p-1">
          <img src="Hirono1.jpg" alt="Hirono 1">
        </div>
      </div>
      <div class="col-12 col-md-2 p-1">
        <div class="card p-1">
          <img src="Hirono2.jpg" alt="Hirono 2">
        </div>
      </div>
      <div class="col-12 col-md-2 p-1">
        <div class="card p-1">
          <img src="Hirono3.jpg" alt="Hirono 3">
        </div>
      </div>
      <div class="col-12 col-md-3 p-1">
        <div class="card p-1">
          <img src="Hirono4.jpg" alt="Hirono 4">
        </div>
      </div>
      <div class="col-12 col-md-3 p-1">
        <div class="card p-1">
          <img src="Hirono5.jpg" alt="Hirono 5">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12 col-md-4">
        <div class="row">
          <div class="col-12 p-1">
            <div class="card p-1">
              <img src="Hirono6.jpg" alt="Hirono 6">
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-md-6 p-1">
            <div class="card p-1">
              <img src="Hirono7.jpg" alt="Hirono 7">
            </div>
          </div>
          <div class="col-12 col-md-6 p-1">
            <div class="card p-1">
              <img src="Hirono8.png" alt="Hirono 8">
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-5 p-1">
        <div class="card p-1 h-100">
          <img src="Hirono9.jpg" alt="Hirono 9">
        </div>
      </div>
      <div class="col-12 col-md-3">
        <div class="row h-100">
          <div class="col-12 col-md-6 p-1">
            <div class="card p-1 h-100">
              <img src="Hirono10.png" alt="Hirono 10">
            </div>
          </div>
          <div class="col-12 col-md-6 p-1">
            <div class="card p-1 h-100">
              <img src="Hirono11.png" alt="Hirono 11">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12 col-md-4 p-1">
        <div class="card p-1">
          <img src="Hirono12.png" alt="Hirono 12">
        </div>
      </div>
      <div class="col-12 col-md-5 p-1">
        <div class="card p-1">
          <img src="Hirono13.png" alt="Hirono 13">
        </div>
      </div>
      <div class="col-12 col-md-3 p-1">
        <div class="card p-1">
          <img src="Hirono14.png" alt="Hirono 14">
        </div>
      </div>
    </div>
  </div>

  <footer class="container-fluid p-3 pb-4 text-center">
    <div class="divider"></div>
    <p class="mb-0 small">&copy; 2026 Hirono Collection. All figures by Pop Mart.</p>
  </footer>

  <button id="scrollTop" title="Back to top">
    <i class="bi bi-chevron-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    // Typewriter
    const roles = [
      'seeing the world through Hirono’s lens',
      'POPMART Hirono figures',
      'for the quiet boy carrying more than he lets on.',
    ];
    let roleIndex = 0, charIndex = 0, deleting = false;
    const roleEl = document.getElementById('role-text');

    function typeWriter() {
      const current = roles[roleIndex];
      if (!deleting) {
        roleEl.textContent = current.slice(0, charIndex + 1);
        charIndex++;
        if (charIndex === current.length) {
          deleting = true;
          setTimeout(typeWriter, 1800);
          return;
        }
      } else {
        roleEl.textContent = current.slice(0, charIndex - 1);
        charIndex--;
        if (charIndex === 0) {
          deleting = false;
          roleIndex = (roleIndex + 1) % roles.length;
        }
      }
      setTimeout(typeWriter, deleting ? 55 : 90);
    }
    typeWriter();

    // Cards reveal (staggered)
    const cards = document.querySelectorAll('.card');
    const cardObs = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => {
            entry.target.classList.add('revealed');
          }, i * 150);
          cardObs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    cards.forEach(c => cardObs.observe(c));

    // Scroll to top
    const scrollBtn = document.getElementById('scrollTop');
    window.addEventListener('scroll', () => {
      scrollBtn.classList.toggle('visible', window.scrollY > 300);
    });
    scrollBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>

</html>
